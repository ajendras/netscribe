name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: if [ -f go.mod ]; then go vet ./...; fi
      - name: Test
        run: if [ -f go.mod ]; then go test ./...; fi
