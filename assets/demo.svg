<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="NetScribe — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">NetScribe — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#00f3ff">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.68s steps(15) 0.60s forwards" fill="#e5e7eb">netscribe serve</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.58s forwards" fill="#94a3b8">NetScribe 0.1.0 starting on http://localhost:8080</text>
<text x="50" y="126" class="l" style="animation:show .01s 1.80s forwards" fill="#94a3b8">Connect to http://localhost:11434 for Ollama (llama3.2 recommended)</text>
<text x="50" y="152" class="l" style="animation:show .01s 2.02s forwards" fill="#94a3b8">Visit the dashboard to upload a HAR file</text>
<text x="28" y="204" class="l" style="animation:show .01s 2.59s forwards"><tspan fill="#00f3ff">❯</tspan></text><text x="50" y="204" class="l ty" style="animation:show .01s 2.59s forwards,type 2.20s steps(77) 2.59s forwards" fill="#e5e7eb">netscribe generate --file=./examples/api.har --type=client --lang=typescript…</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.09s forwards" fill="#94a3b8">Parsed 18 requests → 5 unique endpoints</text>
<text x="50" y="256" class="l" style="animation:show .01s 5.31s forwards" fill="#94a3b8">Inferred schemas and generated axios client</text>
<text x="50" y="282" class="l" style="animation:show .01s 5.53s forwards" fill="#94a3b8">Wrote 142 lines to ./client.ts</text>
<text x="28" y="334" class="l" style="animation:show .01s 6.10s forwards"><tspan fill="#00f3ff">❯</tspan></text><text x="50" y="334" class="l ty" style="animation:show .01s 6.10s forwards,type 1.26s steps(28) 6.10s forwards" fill="#e5e7eb">cat ./client.ts | head -n 12</text>
<text x="50" y="360" class="l" style="animation:show .01s 7.66s forwards" fill="#94a3b8">export const api = {</text>
<text x="50" y="386" class="l" style="animation:show .01s 7.88s forwards" fill="#94a3b8">getUserProfile: (id: string) =&gt;</text>
<text x="50" y="412" class="l" style="animation:show .01s 8.10s forwards" fill="#94a3b8">axios.get&lt;User&gt;(`/users/${id}`),</text>
<text x="50" y="438" class="l" style="animation:show .01s 8.32s forwards" fill="#94a3b8">createOrder: (payload: OrderPayload) =&gt;</text>
<text x="28" y="490" class="l" style="animation:show .01s 8.89s forwards"><tspan fill="#00f3ff">❯</tspan></text><text x="50" y="490" class="l ty" style="animation:show .01s 8.89s forwards,type 2.20s steps(66) 8.89s forwards" fill="#e5e7eb">netscribe generate --file=./examples/api.har --type=test --lang=go</text>
<text x="50" y="516" class="l" style="animation:show .01s 11.39s forwards" fill="#94a3b8">Generated 14 test cases with real response fixtures</text>
<g class="l" style="animation:show .01s 11.61s forwards"><text x="28" y="542" fill="#00f3ff">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
